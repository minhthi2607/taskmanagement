server:
  port: 8080

spring:
  application:
    name: taskmanagement

  datasource:
    url: jdbc:mysql://localhost:3306/taskmanagement_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
app:
    upload-dir: uploads/