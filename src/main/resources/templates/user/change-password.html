<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Đổi mật khẩu</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container-fluid py-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h3 class="fw-bold mb-1"><i class="bi bi-key-fill text-primary me-2"></i>Đổi mật khẩu</h3>
                        <p class="text-muted mb-0">Thay đổi mật khẩu tài khoản của bạn để duy trì bảo mật</p>
                    </div>
                </div>


                <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4">
                        <form th:action="@{/user/change-password}" th:object="${changePasswordDto}" method="post" novalidate>

                            <!-- Mật khẩu hiện tại -->
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label fw-semibold">
                                    Mật khẩu hiện tại <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password"
                                           id="currentPassword"
                                           th:field="*{currentPassword}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                                           placeholder="Nhập mật khẩu đang sử dụng"
                                           required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('currentPassword', 'icon1')">
                                        <i class="bi bi-eye" id="icon1"></i>
                                    </button>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                                </div>
                            </div>

                            <!-- Mật khẩu mới -->
                            <div class="mb-3">
                                <label for="newPassword" class="form-label fw-semibold">
                                    Mật khẩu mới <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password"
                                           id="newPassword"
                                           th:field="*{newPassword}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                                           placeholder="Mật khẩu mới (từ 6 đến 32 ký tự)"
                                           required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('newPassword', 'icon2')">
                                        <i class="bi bi-eye" id="icon2"></i>
                                    </button>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                                </div>
                            </div>

                            <!-- Nhập lại mật khẩu mới -->
                            <div class="mb-4">
                                <label for="confirmNewPassword" class="form-label fw-semibold">
                                    Nhập lại mật khẩu mới <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                    <input type="password"
                                           id="confirmNewPassword"
                                           th:field="*{confirmNewPassword}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'is-invalid' : ''"
                                           placeholder="Xác nhận lại mật khẩu mới"
                                           required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirmNewPassword', 'icon3')">
                                        <i class="bi bi-eye" id="icon3"></i>
                                    </button>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
                                </div>
                            </div>


                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/}" class="btn btn-light px-4">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check-lg me-1"></i> Đổi mật khẩu
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
