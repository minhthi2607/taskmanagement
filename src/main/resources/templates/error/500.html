<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>500 - Lỗi hệ thống</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="card border-0 shadow-sm rounded-4 bg-white text-center p-5 my-4">
            <div class="py-4">
                <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3 d-block"></i>
                <h2 class="fw-bold text-dark mb-2">Đã xảy ra sự cố hệ thống</h2>
                <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Có lỗi không mong muốn xảy ra trong quá trình xử lý yêu cầu. Vui lòng thử lại sau.'}">Lỗi server.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-house-door me-2"></i>Về Trang chủ
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
                        <i class="bi bi-arrow-left me-2"></i>Quay lại trang trước
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
