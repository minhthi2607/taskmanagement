<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>403 - Truy cập bị từ chối</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="card border-0 shadow-sm rounded-4 bg-white text-center p-5 my-4">
            <div class="py-4">
                <i class="bi bi-shield-slash text-danger display-1 mb-3 d-block"></i>
                <h2 class="fw-bold text-dark mb-2">403 - Khởi chối truy cập</h2>
                <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Bạn không có quyền thực hiện thao tác này hoặc truy cập vào trang này.'}">Không có quyền truy cập.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-house-door me-2"></i>Về Trang chủ
                    </a>
                    <a th:href="@{/team/list}" class="btn btn-outline-primary px-4 py-2">
                        <i class="bi bi-arrow-left me-2"></i>Danh sách Nhóm
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
