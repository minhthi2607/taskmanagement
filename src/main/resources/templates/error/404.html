<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>404 - Không tìm thấy trang</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="card border-0 shadow-sm rounded-4 bg-white text-center p-5 my-4">
            <div class="py-4">
                <i class="bi bi-search text-warning display-1 mb-3 d-block"></i>
                <h2 class="fw-bold text-dark mb-2">404 - Không tìm thấy trang</h2>
                <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Trang hoặc tài nguyên bạn tìm kiếm không tồn tại hoặc đã bị xóa.'}">Dữ liệu không tồn tại.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-house-door me-2"></i>Về Trang chủ
                    </a>
                    <a th:href="@{/team/list}" class="btn btn-outline-secondary px-4 py-2">
                        <i class="bi bi-people me-2"></i>Danh sách Nhóm
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
