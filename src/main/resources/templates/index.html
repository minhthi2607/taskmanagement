<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">

<head>
    <title>Trang chủ - Không gian làm việc</title>
</head>

<body>

    <!-- Nội dung chính Trang chủ (Story #1) -->
    <div layout:fragment="content">

        <!-- Flash Notification Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Thành công</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Lỗi</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Header phần Body -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h3 class="fw-bold mb-1">Không gian làm việc</h3>
                <p class="text-muted mb-0">Quản lý các bảng công việc và nhóm làm việc của bạn</p>
            </div>
            <!-- Nút Tạo nhóm nhanh (Story #10) -->
            <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal"
                data-bs-target="#createTeamModal">
                <i class="bi bi-plus-lg"></i>
                <span>Tạo nhóm mới</span>
            </button>
        </div>

        <!-- ==================================================================================== -->
        <!-- KHUNG 1: DANH SÁCH BẢNG TỰ TẠO (PHÂN LOẠI THEO NHÓM) - Story #1                      -->
        <!-- ==================================================================================== -->
        <section class="mb-5">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-workspace text-primary fs-4"></i>
                    <h5 class="fw-bold m-0">Danh sách nhóm của bạn</h5>
                    <span class="badge bg-primary-subtle text-primary rounded-pill">Quản trị / Thành viên</span>
                </div>
                <a th:href="@{/team/list}" class="btn btn-sm btn-link text-decoration-none">Xem tất cả nhóm <i
                        class="bi bi-arrow-right"></i></a>
            </div>

            <!-- Danh sách nhóm động thực tế -->
            <div class="row g-3" th:if="${userTeamsAlphabetical != null and !#lists.isEmpty(userTeamsAlphabetical)}">
                <div th:each="team : ${userTeamsAlphabetical}" class="col-12 col-md-6 col-lg-4">
                    <div class="card border-0 bg-white shadow-sm h-100 p-3 hover-shadow transition">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex align-items-center justify-content-between mb-2">
                                    <span class="badge bg-light text-dark border" th:text="${team.type}">Loại
                                        nhóm</span>
                                    <span th:if="${team.visibility.name() == 'PUBLIC'}"
                                        class="badge bg-success-subtle text-success">
                                        <i class="bi bi-globe me-1"></i>Công khai
                                    </span>
                                    <span th:if="${team.visibility.name() == 'PRIVATE'}"
                                        class="badge bg-secondary-subtle text-secondary">
                                        <i class="bi bi-lock-fill me-1"></i>Riêng tư
                                    </span>
                                </div>
                                <h5 class="card-title fw-bold mb-2">
                                    <a th:href="@{/team/{id}(id=${team.id})}"
                                        class="text-decoration-none text-dark hover-primary" th:text="${team.name}">Tên
                                        nhóm</a>
                                </h5>
                                <p class="card-text text-muted small text-truncate-2 mb-3"
                                    th:text="${team.description != null and !#strings.isEmpty(team.description) ? team.description : 'Chưa có mô tả'}">
                                    Mô tả nhóm...</p>
                            </div>

                            <div class="pt-3 border-top d-flex align-items-center justify-content-between">
                                <span class="text-muted small">
                                    <i class="bi bi-people me-1"></i>
                                    <span th:text="${team.members != null ? #lists.size(team.members) : 0}">0</span>
                                    thành viên
                                </span>
                                <a th:href="@{/team/{id}(id=${team.id})}" class="btn btn-sm btn-outline-primary">
                                    Xem chi tiết <i class="bi bi-arrow-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State nếu chưa có nhóm -->
            <div class="card border-0 bg-white shadow-sm py-4 text-center"
                th:if="${userTeamsAlphabetical == null or #lists.isEmpty(userTeamsAlphabetical)}">
                <div class="card-body">
                    <i class="bi bi-people fs-2 text-muted d-block mb-2"></i>
                    <p class="text-muted mb-3">Bạn chưa tạo hoặc tham gia nhóm nào.</p>
                    <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal"
                        data-bs-target="#createTeamModal">
                        <i class="bi bi-plus-lg me-1"></i> Tạo nhóm ngay
                    </button>
                </div>
            </div>

        </section>


        <!-- ==================================================================================== -->
        <!-- MODAL: TẠO NHÓM MỚI (Story #10)                                                       -->
        <!-- ==================================================================================== -->
        <div class="modal fade" id="createTeamModal" tabindex="-1" aria-labelledby="createTeamModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="createTeamModalLabel">Tạo nhóm mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <!-- Form Submit POST tới /team/create (Story #10) -->
                    <form th:action="@{/team/create}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="teamName" class="form-label fw-semibold">Tên nhóm <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="teamName" name="name"
                                    placeholder="Nhập tên nhóm..." required>
                            </div>
                            <div class="mb-3">
                                <label for="teamType" class="form-label fw-semibold">Loại nhóm <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="teamType" name="type"
                                    placeholder="VD: Kỹ thuật, Marketing, Thiết kế..." required>
                            </div>
                            <div class="mb-3">
                                <label for="teamVisibility" class="form-label fw-semibold">Quyền riêng tư <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" id="teamVisibility" name="visibility" required>
                                    <option value="PRIVATE" selected>🔒 Riêng tư (Chỉ thành viên trong nhóm mới truy cập
                                        được)</option>
                                    <option value="PUBLIC">🌐 Công khai (Bất kỳ ai có liên kết đều nhìn thấy)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="teamDescription" class="form-label fw-semibold">Mô tả nhóm</label>
                                <textarea class="form-control" id="teamDescription" name="description" rows="3"
                                    placeholder="Mô tả mục đích của nhóm..."></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary d-flex align-items-center gap-1">
                                <i class="bi bi-plus-lg"></i>
                                <span>Tạo nhóm</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
