<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Menu trái Fragment (Story #3 & Story #14) -->
    <aside th:fragment="sidebar" id="sidebarMenu" class="app-sidebar collapse d-md-block">
        <div class="sidebar-nav d-flex flex-column h-100">

            <!-- Top Option: Bảng -->
            <ul class="nav nav-pills flex-column mb-3">
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link active">
                        <i class="bi bi-kanban fs-5"></i>
                        <span>Trang chủ</span>
                    </a>
                </li>
                <li class="nav-item mt-1">
                    <a th:href="@{/team/list}" class="nav-link text-dark">
                        <i class="bi bi-grid fs-5"></i>
                        <span>Tất cả nhóm</span>
                    </a>
                </li>
            </ul>

            <hr class="my-2">

            <!-- Section Title & Action: Danh sách các nhóm & Nút Tạo nhóm (Story #14) -->
            <div class="d-flex align-items-center justify-content-between px-2 mb-2">
                <span class="sidebar-section-title m-0">Các nhóm của bạn</span>
                <!-- Nút "Tạo nhóm" (Story #10) -->
                <a th:href="@{/team/create}" 
                   class="btn btn-sm btn-light rounded-circle text-primary p-1" 
                   title="Tạo nhóm mới">
                    <i class="bi bi-plus-lg fs-6"></i>
                </a>
            </div>

            <!-- Danh sách các nhóm của người dùng (Sorted Alphabetically - Story #14) -->
            <div class="flex-grow-1 overflow-auto">
                <ul class="nav nav-pills flex-column" th:if="${userTeamsAlphabetical != null and !#lists.isEmpty(userTeamsAlphabetical)}">
                    <li class="nav-item" th:each="team : ${userTeamsAlphabetical}">
                        <a th:href="@{/team/{id}(id=${team.id})}" class="nav-link text-dark">
                            <i class="bi bi-people-fill text-primary"></i>
                            <span class="text-truncate" th:text="${team.name}">Tên Nhóm</span>
                        </a>
                    </li>
                </ul>
                <div class="px-2 py-3 text-muted small text-center" th:if="${userTeamsAlphabetical == null or #lists.isEmpty(userTeamsAlphabetical)}">
                    <em>Chưa có nhóm nào</em>
                </div>
            </div>

            <!-- Bottom Section: Quick Button "Tạo nhóm mới" -->
            <div class="pt-3 border-top mt-auto">
                <a th:href="@{/team/create}" 
                   class="btn btn-outline-primary btn-sm w-100 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-plus-circle"></i>
                    <span>Tạo nhóm mới</span>
                </a>
            </div>

        </div>
    </aside>

</body>
</html>
