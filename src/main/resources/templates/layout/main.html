<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Task Management">Task Management</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <!-- Header Fragment (Menu top) -->
    <header th:replace="~{layout/header :: header}"></header>

    <!-- Main Layout Container (Sidebar + Body Content) -->
    <div class="app-wrapper">
        <!-- Sidebar Fragment (Menu trái) -->
        <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

        <!-- Body Content Fragment -->
        <main class="app-content">
            <div layout:fragment="content">
                <!-- Nội dung các trang con sẽ tự động chèn vào đây qua layout:fragment="content" -->
            </div>
        </main>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Optional script slot for child views -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
