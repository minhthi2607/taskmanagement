<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- Menu top Fragment (Story #2) -->
    <header th:fragment="header" class="app-header navbar navbar-expand-md fixed-top px-3 shadow-sm">
        <div class="container-fluid">
            <!-- Left Side: Logo App & Mobile Sidebar Toggle -->
            <div class="d-flex align-items-center">
                <!-- Mobile Sidebar Toggle -->
                <button class="btn btn-light d-md-none me-2" type="button" data-bs-toggle="collapse"
                    data-bs-target="#sidebarMenu" aria-label="Toggle sidebar">
                    <i class="bi bi-list fs-5"></i>
                </button>

                <!-- Logo ứng dụng (Góc trái) -->
                <a class="brand-logo me-4" th:href="@{/}">
                    <i class="bi bi-kanban-fill fs-4"></i>
                    <span>TaskManagement</span>
                </a>

                <!-- Lối tắt hiển thị Danh sách các nhóm của người dùng -->
                <div class="dropdown d-none d-sm-block" sec:authorize="isAuthenticated()">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button"
                        id="teamsShortcutDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-people me-1"></i> Các nhóm của tôi
                    </button>
                    <ul class="dropdown-menu shadow py-2" style="max-width: 280px; max-height: 320px; overflow-y: auto;"
                        aria-labelledby="teamsShortcutDropdown">
                        <li>
                            <h6 class="dropdown-header fw-bold">Danh sách nhóm của bạn</h6>
                        </li>
                        <li th:each="team : ${userTeamsAlphabetical}">
                            <a class="dropdown-item d-flex align-items-center gap-2 text-truncate py-1.5"
                                th:href="@{/team/{id}(id=${team.id})}">
                                <i class="bi bi-folder2-open text-primary fs-6"></i>
                                <span class="text-truncate" th:text="${team.name}">Tên Nhóm</span>
                            </a>
                        </li>
                        <li th:if="${userTeamsAlphabetical == null or #lists.isEmpty(userTeamsAlphabetical)}">
                            <span class="dropdown-item text-muted small"><em>Chưa có nhóm nào</em></span>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-primary fw-semibold" th:href="@{/team/list}"><i
                                    class="bi bi-grid me-2"></i>Xem tất cả nhóm</a></li>
                    </ul>
                </div>
            </div>

            <!-- Right Side: Thông báo & Tài khoản người dùng -->
            <div class="d-flex align-items-center gap-3">

                <!-- Nút Thông báo (Icon quả chuông 🔔) -->
                <div class="dropdown" sec:authorize="isAuthenticated()">
                    <button class="btn btn-light rounded-circle position-relative p-2" type="button"
                        id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Thông báo">
                        <i class="bi bi-bell fs-5"></i>
                        <span th:if="${unreadNotificationCount > 0}"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            <span th:text="${unreadNotificationCount}">0</span>
                            <span class="visually-hidden">Thông báo chưa đọc</span>
                        </span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow p-2" style="width: 320px; max-height: 400px; overflow-y: auto;"
                        aria-labelledby="notificationDropdown">
                        <li class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-1">
                            <h6 class="dropdown-header p-0 mb-0">Thông báo</h6>
                            <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}"
                                method="post" class="m-0">
                                <button type="submit" class="btn btn-link btn-sm p-0 small text-decoration-none">
                                    Đánh dấu tất cả đã đọc
                                </button>
                            </form>
                        </li>
                        <li th:if="${userNotifications == null or #lists.isEmpty(userNotifications)}"
                            class="py-2 px-3 text-muted small text-center">Không có thông báo mới nào</li>
                        <li th:each="notif, iterStat : ${userNotifications}" th:if="${iterStat.index < 10}">
                            <form th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post" class="m-0">
                                <button type="submit"
                                    class="dropdown-item d-flex flex-column align-items-start gap-1 py-2 text-wrap"
                                    th:classappend="${notif.isRead} ? 'text-muted' : 'bg-primary-subtle fw-semibold'">
                                    <span class="small text-wrap text-start" th:text="${notif.content}">Nội dung thông báo</span>
                                    <span class="text-muted" style="font-size: 0.75rem;"
                                        th:text="${#temporals.format(notif.createdAt, 'dd/MM HH:mm')}">01/01 00:00</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- Trường hợp: ĐÃ ĐĂNG NHẬP (sec:authorize="isAuthenticated()") -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark"
                        id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <!-- Avatar đại diện -->
                        <div class="avatar-circle me-2" th:with="hasAvatar=${#authentication.principal.user.avatarUrl != null and !#authentication.principal.user.avatarUrl.isBlank()},
                                      user=${#authentication.principal.user}">
                            <img th:if="${hasAvatar}" th:src="${user.avatarUrl}" alt="Avatar"
                                class="w-100 h-100 rounded-circle" style="object-fit: cover;">
                            <span th:unless="${hasAvatar}"
                                th:text="${user.displayName != null and !#strings.isEmpty(user.displayName) ? #strings.substring(user.displayName, 0, 1) : 'U'}">U</span>
                        </div>
                        <!-- Tên hiển thị người dùng -->
                        <span class="fw-semibold d-none d-md-inline"
                            th:text="${#authentication.principal.user.displayName}">Tên người dùng</span>

                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userMenuDropdown">
                        <li class="px-3 py-2 border-bottom">
                            <div class="fw-bold" th:text="${#authentication.principal.user.displayName}">Tên người dùng
                            </div>
                            <div class="small text-muted" th:text="${#authentication.principal.user.email}">
                                email@example.com</div>

                        </li>
                        <!-- Story #9: Thay đổi thông tin cá nhân -->
                        <li>
                            <a class="dropdown-item" th:href="@{/user/profile}">
                                <i class="bi bi-person me-2"></i> Chỉnh sửa thông tin
                            </a>
                        </li>
                        <!-- Story #8: Đổi mật khẩu -->
                        <li>
                            <a class="dropdown-item" th:href="@{/user/change-password}">
                                <i class="bi bi-key me-2"></i> Đổi mật khẩu
                            </a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <!-- Nút Đăng xuất -->
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- Trường hợp: CHƯA ĐĂNG NHẬP (sec:authorize="isAnonymous()") -->
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a th:href="@{/auth/login}" class="btn btn-outline-primary btn-sm px-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                    </a>
                    <a th:href="@{/auth/register}" class="btn btn-primary btn-sm px-3 d-none d-sm-inline-block">
                        Đăng ký
                    </a>
                </div>

            </div>
        </div>
    </header>

</body>

</html>
